services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gameeducator
      POSTGRES_USER: gameeducator
      POSTGRES_PASSWORD: gameeducator
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameeducator -d gameeducator"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres,dev
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gameeducator
      DB_USER: gameeducator
      DB_PASSWORD: gameeducator
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - backend
    ports:
      - "8081:80"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gameeducator.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db-data:
