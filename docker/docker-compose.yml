# IMAGE_TAG: tag das imagens gameeducator-backend/gameeducator-frontend.
# Localmente ("docker compose up --build") fica "local" por padrao. A
# pipeline do Jenkins (ver Jenkinsfile) define IMAGE_TAG com a tag que ela
# acabou de construir e sobe com "up --no-build", para nunca reconstruir uma
# imagem diferente da que os testes validaram.
# Nome de projeto explicito: sem isto o Compose usa o nome da pasta
# ("docker") como projeto, que colide com qualquer outro checkout deste
# repo cujo diretorio docker/ tambem se chame "docker" -- containers,
# volumes (db-data, pgadmin-data) e a network ficam compartilhados entre
# os dois checkouts, causando estado (senha, servidor cadastrado) de um
# vazar para o outro.
name: gameeducator

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gameeducator
      POSTGRES_USER: gameeducator
      POSTGRES_PASSWORD: gameeducator
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameeducator -d gameeducator"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: gameeducator-backend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres,dev
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: gameeducator
      DB_USER: gameeducator
      DB_PASSWORD: gameeducator
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    image: gameeducator-frontend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - backend
    ports:
      - "8081:80"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      # Nao usar TLD reservado (.local): o validador de e-mail do pgAdmin
      # rejeita e o container sai com codigo 1 antes de subir.
      PGADMIN_DEFAULT_EMAIL: admin@gameeducator.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Desktop mode: sem tela de login. O pgAdmin fica aberto para
      # qualquer um que alcance a porta 5050 -- use so em ambiente local.
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      # Em desktop mode o pgAdmin loga sozinho como DESKTOP_USER; sem isto
      # ele procura o usuario padrao pgadmin4@pgadmin.org e devolve 401.
      # PGADMIN_CONFIG_* e avaliado como literal Python -> aspas duplas.
      PGADMIN_CONFIG_DESKTOP_USER: "'admin@gameeducator.com'"
      # Registra o servidor 'db' sozinho na arvore do pgAdmin. Importado
      # na primeira subida do container (config db vazia) -- ver README.
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      # Sem isto o import so roda quando a config db do pgAdmin ainda nao
      # existe. Ela vive no volume abaixo e sobrevive a recriacoes do
      # container, entao o servidor sumiria do servers.json em diante.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
      # pgpass -> o entrypoint copia para /var/lib/pgadmin/.pgpass (chmod
      # 600) e o servers.json aponta PassFile para la, entao o pgAdmin
      # conecta sem pedir senha. So e instalado na PRIMEIRA subida: se
      # mudar o arquivo, recrie o volume pgadmin-data.
      PGPASS_FILE: /pgadmin4/pgpass
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin-pgpass:/pgadmin4/pgpass:ro
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  db-data:
  pgadmin-data:
